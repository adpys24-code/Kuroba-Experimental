name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.44-mod1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > $GITHUB_WORKSPACE/kurobaex.jks

      - name: Build signed release APKs
        run: |
          cd Kuroba
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PbuildType=0 \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/kurobaex.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: Kuroba/app/build/outputs/apk/release/*.apk
